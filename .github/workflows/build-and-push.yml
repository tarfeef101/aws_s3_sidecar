name: Build and Push Image

on:
  schedule:
    - cron: "0 4 * * 1" # weekly, Mondays at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      IMAGE: tarfeef101/s3_sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t local-build:tmp .

      - name: Test image
        run: |
          set -euo pipefail
          trap "docker compose -f test/docker-compose.test.yml down -v --remove-orphans" EXIT
          docker compose -f test/docker-compose.test.yml up -d
          echo "Waiting for test container to fetch the file and serve it..."
          for i in $(seq 1 60); do
            if curl -sf -m 5 http://localhost:8000/readme.html -o /dev/null; then
              echo "File is being served successfully"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: file was not served within 120s"
          docker compose -f test/docker-compose.test.yml logs
          exit 1

      - name: Detect alpine and awscli versions
        id: versions
        run: |
          ALPINE_FULL=$(docker run --rm local-build:tmp cat /etc/alpine-release)
          ALPINE=$(echo "$ALPINE_FULL" | cut -d. -f1,2)
          AWSCLI=$(docker run --rm local-build:tmp aws --version | awk '{print $1}' | sed 's|^aws-cli/||')
          TAG="${ALPINE}-${AWSCLI}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building image with tag: ${TAG}"

      - name: Check if tag already exists
        if: github.event_name == 'schedule'
        id: exists
        run: |
          set -euo pipefail
          token=$(curl -sf "https://hub.docker.com/v2/repositories/${{ env.IMAGE }}/tags/${{ steps.versions.outputs.tag }}/" | awk -F'"' '/"name"/{print $4}')
          if [[ -n "$token" && "$token" != "null" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag already published, skipping push"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: steps.exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.versions.outputs.tag }}"
          docker tag local-build:tmp "${{ env.IMAGE }}:${TAG}"
          docker push "${{ env.IMAGE }}:${TAG}"
          docker tag local-build:tmp "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:latest"
